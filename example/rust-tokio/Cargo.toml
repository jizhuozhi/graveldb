[package]
name = "graveldb-tokio-example"
version = "0.1.0"
edition = "2021"
description = "GravelDB embedded in a Rust Tokio async service"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
moka = { version = "0.12", features = ["future"] }

[build-dependencies]
cc = "1"
